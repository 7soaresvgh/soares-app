    function playBeep(type) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (type === 'click') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'confirm') {
          const freqs = [659.25, 659.25, 659.25];
          freqs.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.12));
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime + (idx * 0.12));
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + (idx * 0.12));
            osc.stop(audioCtx.currentTime + (idx * 0.12) + 0.1);
          });
        }
      } catch(e){}
    }

            </div>
          `;
        }).join('');

        container.innerHTML = `
          <div class="bg-slate-900 border border-purple-500/40 rounded-3xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-trophy text-amber-400"></i> Apuração da Eleição
              </h2>
              <button onclick="goTo('welcome')" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg text-slate-300 font-semibold">Sair do Painel</button>
            </div>

            <div class="grid grid-cols-3 gap-3 text-center mb-6">
              <div class="bg-slate-800 p-3.5 rounded-xl border border-purple-500/20">
                <span class="text-xs text-purple-300">Total de Votos</span>
                <p class="text-2xl font-black text-white">${totalVotosGeral}</p>
              </div>
              <div class="bg-slate-800 p-3.5 rounded-xl border border-purple-500/20">
                <span class="text-xs text-purple-300">Em Branco</span>
                <p class="text-2xl font-black text-slate-300">${votosEmBranco}</p>
              </div>
              <div class="bg-slate-800 p-3.5 rounded-xl border border-purple-500/20">
                <span class="text-xs text-purple-300">Total Votantes</span>
                <p class="text-2xl font-black text-cyan-400">${rasVotaram.size}</p>
              </div>
            </div>

            <div class="mb-6">
              <h3 class="font-bold text-cyan-300 text-sm mb-3 flex items-center gap-2">
                <i class="fa-solid fa-chart-simple"></i> Classificação das Chapas
              </h3>
              ${rankingRows}
            </div>

            <div class="bg-slate-800/80 p-5 rounded-2xl border border-purple-500/30">
              <h3 id="form-title" class="font-bold text-cyan-300 text-sm mb-3">+ Cadastrar Nova Chapa</h3>
              
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                <input type="text" id="new-num" placeholder="Número (ex: 10)" class="bg-slate-900 border border-purple-500/30 p-2.5 rounded-lg text-xs text-white focus:outline-none focus:border-cyan-400">
                <input type="text" id="new-nome" placeholder="Nome da Chapa (ex: Jovens Extraordinários)" class="bg-slate-900 border border-purple-500/30 p-2.5 rounded-lg text-xs text-white focus:outline-none focus:border-cyan-400">
                <input type="text" id="new-pres" placeholder="Nome do Presidente" class="bg-slate-900 border border-purple-500/30 p-2.5 rounded-lg text-xs text-white focus:outline-none focus:border-cyan-400">
                <input type="text" id="new-vice" placeholder="Nome do Vice-Presidente" class="bg-slate-900 border border-purple-500/30 p-2.5 rounded-lg text-xs text-white focus:outline-none focus:border-cyan-400">
                <input type="text" id="new-slogan" placeholder="Slogan ou lema" class="bg-slate-900 border border-purple-500/30 p-2.5 rounded-lg text-xs text-white focus:outline-none focus:border-cyan-400 col-span-full">
              </div>

              <div class="mb-4">
                <label class="block text-xs font-semibold text-purple-300 mb-2"><i class="fa-solid fa-image text-cyan-400"></i> Foto da Chapa (Buscar na Galeria):</label>
                <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-700 file:text-white hover:file:bg-purple-600 cursor-pointer">
                <div id="image-preview-container" class="mt-3 hidden items-center gap-3">
                  <img id="image-preview" class="w-16 h-16 rounded-lg object-contain bg-black border border-cyan-400">
                  <span class="text-xs text-emerald-400 font-semibold">Foto selecionada da galeria!</span>
                </div>
              </div>
              
              <div class="flex gap-2">
                <button onclick="saveChapa()" id="save-btn" class="flex-1 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-xs font-bold rounded-xl hover:brightness-110 shadow-lg">Salvar Chapa</button>
                <button onclick="cancelEdit()" id="cancel-btn" class="hidden px-4 py-2.5 bg-slate-700 text-xs font-bold rounded-xl hover:bg-slate-600">Cancelar</button>
              </div>
            </div>
          </div>
        `;
      }
    }

    function goTo(screen) {
      playBeep('click');
      currentScreen = screen;
      render();
    }

    function submitRA() {
      const field = document.getElementById('ra-field');
      const error = document.getElementById('ra-error');
      const ra = field.value.trim().toUpperCase();

      if (!ra) {
        error.innerText = "Por favor, informe o R.A.!";
        error.classList.remove('hidden');
        return;
      }

      if (!alunosDB[ra]) {
        error.innerText = "R.A. não encontrado na lista de alunos!";
        error.classList.remove('hidden');
        return;
      }

      if (rasVotaram.has(ra)) {
        error.innerText = "Este R.A. já votou nesta eleição!";
        error.classList.remove('hidden');
        return;
      }

      currentRA = ra;
      currentStudentName = alunosDB[ra];
      goTo('voting');
    }

    function selectChapa(id) {
      playBeep('click');
      selectedChapa = chapas.find(c => c.id === id);
      goTo('confirm');
    }

    function voteBranco() {
      playBeep('click');
      selectedChapa = 'BRANCO';
      goTo('confirm');
    }

    function confirmVote() {
      playBeep('confirm');
      if (selectedChapa === 'BRANCO') {
        votosEmBranco++;
      } else if (selectedChapa) {
        selectedChapa.votos++;
      }

      if (currentRA) {
        rasVotaram.add(currentRA);
      }

      goTo('success');
    }

    function toggleMesarioModal() {
      playBeep('click');
      const modal = document.getElementById('mesario-modal');
      modal.classList.toggle('hidden');
    }

    function loginMesario() {
      const pass = document.getElementById('mesario-pass').value;
      if (pass === '1234' || pass === 'admin') {
        document.getElementById('mesario-pass').value = '';
        toggleMesarioModal();
        goTo('dashboard');
      } else {
        alert("Senha incorreta! (Padrão: 1234)");
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentUploadedImage = e.target.result;
          const preview = document.getElementById('image-preview');
          const previewContainer = document.getElementById('image-preview-container');
          if (preview && previewContainer) {
            preview.src = currentUploadedImage;
            previewContainer.classList.remove('hidden');
            previewContainer.classList.add('flex');
          }
        };
        reader.readAsDataURL(file);
      }
    }

    function saveChapa() {
      const num = document.getElementById('new-num').value.trim();
      const nome = document.getElementById('new-nome').value.trim();
      const pres = document.getElementById('new-pres').value.trim();
      const vice = document.getElementById('new-vice').value.trim();
      const slogan = document.getElementById('new-slogan').value.trim() || 'Juntos pelo Poitena!';
      const foto = currentUploadedImage || 'https://images.unsplash.com/photo-1577896851231-70ef18881754?w=400&auto=format&fit=crop&q=80';

      if (!num || !nome || !pres) {
        alert("Preencha ao menos o Número, Nome e Presidente da chapa!");
        return;
      }

      if (editingChapaId) {
        const chapa = chapas.find(c => c.id === editingChapaId);
        if (chapa) {
          chapa.numero = num;
          chapa.nome = nome;
          chapa.presidente = pres;
          chapa.vice = vice || 'Não informado';
          chapa.slogan = slogan;
          chapa.foto = foto;
        }
        editingChapaId = null;
      } else {
        chapas.push({
          id: Date.now(),
          numero: num,
          nome: nome,
          presidente: pres,
          vice: vice || 'Não informado',
          slogan: slogan,
          foto: foto,
          cor: 'from-purple-600 to-indigo-600',
          votos: 0
        });
      }

      currentUploadedImage = '';
      render();
    }

    function editChapa(id) {
      const c = chapas.find(item => item.id === id);
      if (!c) return;

      editingChapaId = id;
      currentUploadedImage = c.foto;
      render();

      document.getElementById('form-title').innerText = "Editar Chapa " + c.numero;
      document.getElementById('new-num').value = c.numero;
      document.getElementById('new-nome').value = c.nome;
      document.getElementById('new-pres').value = c.presidente;
      document.getElementById('new-vice').value = c.vice;
      document.getElementById('new-slogan').value = c.slogan;

      const preview = document.getElementById('image-preview');
      const previewContainer = document.getElementById('image-preview-container');
      if (preview && previewContainer) {
        preview.src = c.foto;
        previewContainer.classList.remove('hidden');
        previewContainer.classList.add('flex');
      }

      document.getElementById('cancel-btn').classList.remove('hidden');
      document.getElementById('save-btn').innerText = "Salvar Alterações";
    }

    function cancelEdit() {
      editingChapaId = null;
      currentUploadedImage = '';
      render();
    }

    function deleteChapa(id) {
      if (confirm("Tem certeza que deseja excluir esta chapa?")) {
        chapas = chapas.filter(c => c.id !== id);
        render();
      }
    }

    render();
  </script>
</body>
</html>
