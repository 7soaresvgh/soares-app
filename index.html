<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soares Zap</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs Compatíveis -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #1e1f22; color: #dbdee1; height: 100vh; display: flex; overflow: hidden; }

    /* AUTH SCREEN */
    #auth-screen {
      position: fixed; inset: 0; background: linear-gradient(135deg, #111214 0%, #2b2d31 100%);
      display: flex; justify-content: center; align-items: center; z-index: 10000;
    }
    .auth-box {
      background: #313338; width: 400px; max-width: 90%; padding: 32px; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center;
    }
    .auth-logo { font-size: 36px; color: #5865f2; margin-bottom: 8px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .auth-box h2 { color: #f2f3f5; font-size: 20px; margin-bottom: 20px; }
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-group label { display: block; color: #b5bac1; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    .input-group input {
      width: 100%; padding: 12px; background: #1e1f22; border: 1px solid #111214; border-radius: 6px;
      color: #f2f3f5; font-size: 14px; outline: none; transition: border 0.2s;
    }
    .input-group input:focus { border-color: #5865f2; }
    .btn-auth {
      width: 100%; padding: 12px; background: #5865f2; color: white; border: none; border-radius: 6px;
      font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 8px; transition: background 0.2s;
    }
    .btn-auth:hover { background: #4752c4; }
    .auth-switch { margin-top: 16px; font-size: 13px; color: #949ba4; }
    .auth-switch span { color: #00a8fc; cursor: pointer; text-decoration: underline; }

    /* INSTAGRAM MODAL */
    #insta-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center;
      align-items: center; z-index: 9999; animation: fadeIn 0.3s;
    }
    .insta-box {
      background: #2b2d31; border-radius: 16px; width: 340px; padding: 24px; text-align: center;
      position: relative; border: 2px solid #e1306c; box-shadow: 0 0 20px rgba(225, 48, 108, 0.3);
    }
    .close-insta { position: absolute; top: 12px; right: 16px; color: #b5bac1; font-size: 20px; cursor: pointer; }
    .close-insta:hover { color: white; }
    .insta-icon { font-size: 48px; background: -webkit-linear-gradient(#405de6, #833ab4, #e1306c, #fcaf45); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
    .insta-link { display: block; background: #1e1f22; padding: 10px; border-radius: 8px; margin: 10px 0; color: #f2f3f5; text-decoration: none; font-weight: bold; border: 1px solid #3f4147; }
    .insta-link:hover { background: #e1306c; color: white; }

    /* APP LAYOUT */
    #app-container { display: flex; width: 100vw; height: 100vh; }
    
    /* SERVER SIDEBAR */
    .servers-bar { width: 72px; background: #1e1f22; display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; }
    .server-icon {
      width: 48px; height: 48px; border-radius: 50%; background: #313338; display: flex; align-items: center;
      justify-content: center; cursor: pointer; color: #dbdee1; transition: all 0.2s; position: relative; font-weight: bold;
    }
    .server-icon:hover, .server-icon.active { border-radius: 16px; background: #5865f2; color: white; }
    .server-divider { width: 32px; height: 2px; background: #35363c; margin: 4px 0; }

    /* SUB SIDEBAR */
    .sub-sidebar { width: 240px; background: #2b2d31; display: flex; flex-direction: column; }
    .sidebar-header { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1f2023; font-weight: bold; color: #f2f3f5; }
    .channels-list { flex: 1; padding: 12px; overflow-y: auto; }
    .channel-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 4px; cursor: pointer; color: #949ba4; margin-bottom: 2px; }
    .channel-item:hover, .channel-item.active { background: #35373c; color: #f2f3f5; }

    /* USER PANEL */
    .user-panel { height: 52px; background: #232428; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #5865f2; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }

    /* MAIN CHAT AREA */
    .chat-area { flex: 1; background: #313338; display: flex; flex-direction: column; }
    .chat-header { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2b2d31; font-weight: bold; color: #f2f3f5; }
    .messages-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .message { display: flex; gap: 12px; }
    .message-content h4 { color: #f2f3f5; font-size: 14px; margin-bottom: 4px; }
    .message-content h4 span { font-size: 11px; color: #949ba4; font-weight: normal; margin-left: 8px; }
    .message-content p { color: #dbdee1; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .message-img { max-width: 280px; max-height: 200px; border-radius: 8px; margin-top: 6px; }

    /* CHAT INPUT */
    .chat-input-area { padding: 0 16px 24px 16px; }
    .input-wrapper { background: #383a40; border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
    .input-wrapper input { flex: 1; background: transparent; border: none; outline: none; color: #f2f3f5; font-size: 15px; }
    .input-btn { color: #b5bac1; cursor: pointer; font-size: 18px; }
    .input-btn:hover { color: #f2f3f5; }

    /* FRIENDS & SERVERS VIEW */
    .view-container { flex: 1; padding: 24px; overflow-y: auto; display: none; }
    .friends-header { display: flex; gap: 16px; border-bottom: 1px solid #3f4147; padding-bottom: 12px; margin-bottom: 16px; }
    .friend-tab { padding: 6px 12px; border-radius: 4px; cursor: pointer; color: #b5bac1; font-weight: bold; }
    .friend-tab.active { background: #3f4147; color: white; }
    .server-card { background: #2b2d31; border-radius: 8px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <!-- TELA DE AUTENTICAÇÃO -->
  <div id="auth-screen">
    <div class="auth-box">
      <div class="auth-logo"><i class="fa-solid fa-bolt"></i> Soares Zap</div>
      <h2 id="auth-title">Boas-vindas de volta!</h2>
      
      <div class="input-group" id="group-username" style="display: none;">
        <label>Nome de Usuário</label>
        <input type="text" id="auth-username" placeholder="Seu nome no app">
      </div>
      <div class="input-group">
        <label>E-mail</label>
        <input type="email" id="auth-email" placeholder="seu@email.com">
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="auth-password" placeholder="******">
      </div>
      <button class="btn-auth" id="btn-auth-submit" onclick="handleAuth()">Entrar</button>
      
      <div class="auth-switch">
        <span id="auth-toggle-text">Precisando de uma conta?</span>
        <span onclick="toggleAuthMode()" id="auth-toggle-btn">Registre-se</span>
      </div>
    </div>
  </div>

  <!-- MODAL DO INSTAGRAM -->
  <div id="insta-modal">
    <div class="insta-box">
      <div class="close-insta" onclick="closeInstaModal()"><i class="fa-solid fa-xmark"></i></div>
      <i class="fa-brands fa-instagram insta-icon"></i>
      <h3>Siga os Criadores!</h3>
      <p style="color: #b5bac1; margin-bottom: 16px; font-size: 14px;">Acompanhe o projeto no Instagram:</p>
      <a href="https://instagram.com/7soaresvgh" target="_blank" class="insta-link">@7soaresvgh</a>
      <a href="https://instagram.com/murilo__xyz" target="_blank" class="insta-link">@murilo__xyz</a>
    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL -->
  <div id="app-container">
    
    <!-- BARRA LATERAL DE SERVIDORES -->
    <div class="servers-bar">
      <div class="server-icon active" id="btn-dm" onclick="openDirectMessages()" title="Mensagens Diretas">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <div class="server-divider"></div>
      
      <div id="servers-list"></div>

      <div class="server-icon" onclick="openSearchServers()" title="Explorar Servidores Públicos" style="color: #23a55a;">
        <i class="fa-solid fa-compass"></i>
      </div>
      <div class="server-icon" onclick="createServerPrompt()" title="Criar Servidor" style="color: #23a55a;">
        <i class="fa-solid fa-plus"></i>
      </div>
    </div>

    <!-- SUB-BARRA LATERAL (CANAIS / AMIGOS) -->
    <div class="sub-sidebar">
      <div class="sidebar-header" id="sidebar-header-title">
        <span>Soares Zap</span>
      </div>
      
      <div class="channels-list" id="channels-list"></div>

      <!-- PAINEL DO USUÁRIO -->
      <div class="user-panel">
        <div class="user-info">
          <div class="avatar" id="current-user-avatar">?</div>
          <div>
            <div style="font-size: 13px; font-weight: bold; color: white;" id="current-user-name">Usuário</div>
            <div style="font-size: 10px; color: #23a55a;">● Online</div>
          </div>
        </div>
        <div style="display: flex; gap: 8px; color: #b5bac1;">
          <i class="fa-solid fa-arrow-right-from-bracket input-btn" onclick="logout()" title="Sair"></i>
        </div>
      </div>
    </div>

    <!-- TELA PRINCIPAL DE CHAT -->
    <div class="chat-area" id="main-chat-area">
      <div class="chat-header">
        <span id="chat-title"># geral</span>
      </div>

      <div class="messages-container" id="messages-container"></div>

      <!-- BARRA DE DIGITAÇÃO -->
      <div class="chat-input-area">
        <div class="input-wrapper">
          <label for="img-upload" class="input-btn" title="Enviar Foto">
            <i class="fa-solid fa-circle-plus"></i>
          </label>
          <input type="file" id="img-upload" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
          
          <input type="text" id="chat-message-input" placeholder="Conversar em #geral..." onkeypress="if(event.key==='Enter') sendMessage()">
          
          <i class="fa-solid fa-microphone input-btn" id="mic-btn" onclick="toggleAudioRecord()" title="Gravar Áudio"></i>
          <i class="fa-solid fa-paper-plane input-btn" onclick="sendMessage()" style="color: #5865f2;"></i>
        </div>
      </div>
    </div>

    <!-- TELA DE AMIGOS -->
    <div class="view-container" id="friends-view">
      <div class="friends-header">
        <div class="friend-tab active">Amigos</div>
        <div class="friend-tab" onclick="addFriendPrompt()" style="background: #23a55a; color: white;">+ Adicionar Amigo</div>
      </div>
      <h3 style="color: #f2f3f5; margin-bottom: 12px;">Seus Amigos</h3>
      <div id="friends-list"></div>
    </div>

    <!-- TELA DE EXPLORAR SERVIDORES -->
    <div class="view-container" id="search-servers-view">
      <h2 style="color: white; margin-bottom: 16px;">Explorar Servidores Públicos</h2>
      <div id="public-servers-list"></div>
    </div>

  </div>

  <script>
    // Suas credenciais oficiais do projeto soares-zap!
    const firebaseConfig = {
      apiKey: "AIzaSyCgrMIPnbgz0sEBX3JhJ3sXVOCYMiM-3EI",
      authDomain: "soares-zap.firebaseapp.com",
      projectId: "soares-zap",
      storageBucket: "soares-zap.firebasestorage.app",
      messagingSenderId: "19280861322",
      appId: "1:19280861322:web:a8209a4aa491f7c0eb7573",
      measurementId: "G-RCKF3Y8EZR"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let isSignUp = false;
    let currentServerId = null;
    let currentChannelId = 'geral';
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    // Login e autenticação
    auth.onAuthStateChanged(user => {
      if (user) {
        db.ref('users/' + user.uid).once('value', snapshot => {
          currentUser = { uid: user.uid, email: user.email, ...snapshot.val() };
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('current-user-name').innerText = currentUser.username || user.email.split('@')[0];
          document.getElementById('current-user-avatar').innerText = (currentUser.username || 'U')[0].toUpperCase();
          document.getElementById('insta-modal').style.display = 'flex';
          
          loadServers();
          openDirectMessages();
        });
      } else {
        document.getElementById('auth-screen').style.display = 'flex';
      }
    });

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      document.getElementById('auth-title').innerText = isSignUp ? "Criar uma conta" : "Boas-vindas de volta!";
      document.getElementById('group-username').style.display = isSignUp ? "block" : "none";
      document.getElementById('btn-auth-submit').innerText = isSignUp ? "Cadastrar" : "Entrar";
      document.getElementById('auth-toggle-text').innerText = isSignUp ? "Já tem uma conta?" : "Precisando de uma conta?";
      document.getElementById('auth-toggle-btn').innerText = isSignUp ? "Entrar" : "Registre-se";
    }

    function handleAuth() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const username = document.getElementById('auth-username').value;

      if (!email || !password) return alert("Preencha e-mail e senha!");

      if (isSignUp) {
        if (!username) return alert("Digite um nome de usuário!");
        auth.createUserWithEmailAndPassword(email, password).then(res => {
          db.ref('users/' + res.user.uid).set({
            username: username,
            email: email,
            created_at: Date.now()
          });
        }).catch(err => alert("Erro ao criar conta: " + err.message));
      } else {
        auth.signInWithEmailAndPassword(email, password).catch(err => alert("Erro ao entrar: " + err.message));
      }
    }

    function logout() { auth.signOut(); location.reload(); }
    function closeInstaModal() { document.getElementById('insta-modal').style.display = 'none'; }

    // Servidores
    function createServerPrompt() {
      const name = prompt("Digite o nome do seu novo Servidor:");
      if (!name) return;
      const serverRef = db.ref('servers').push();
      serverRef.set({
        name: name,
        owner: currentUser.uid,
        members: { [currentUser.uid]: true },
        channels: { geral: { name: 'geral', type: 'text' } }
      });
    }

    function loadServers() {
      db.ref('servers').on('value', snapshot => {
        const list = document.getElementById('servers-list');
        list.innerHTML = '';
        snapshot.forEach(child => {
          const server = child.val();
          if (server.members && server.members[currentUser.uid]) {
            const el = document.createElement('div');
            el.className = `server-icon ${currentServerId === child.key ? 'active' : ''}`;
            el.innerText = server.name.substring(0, 2).toUpperCase();
            el.onclick = () => selectServer(child.key, server);
            list.appendChild(el);
          }
        });
      });
    }

    function selectServer(serverId, server) {
      currentServerId = serverId;
      document.getElementById('sidebar-header-title').innerText = server.name;
      document.getElementById('main-chat-area').style.display = 'flex';
      document.getElementById('friends-view').style.display = 'none';
      document.getElementById('search-servers-view').style.display = 'none';

      const channelsList = document.getElementById('channels-list');
      channelsList.innerHTML = '<div style="font-size:11px; font-weight:bold; color:#80848e; margin-bottom:8px;">CANAIS DE TEXTO</div>';
      
      Object.keys(server.channels || {}).forEach(cId => {
        const ch = server.channels[cId];
        const item = document.createElement('div');
        item.className = 'channel-item';
        item.innerHTML = `<i class="fa-solid fa-hashtag"></i> ${ch.name}`;
        item.onclick = () => { currentChannelId = cId; listenMessages(); };
        channelsList.appendChild(item);
      });

      currentChannelId = 'geral';
      listenMessages();
    }

    // Chat e mensagens
    function listenMessages() {
      if (!currentServerId) return;
      const msgRef = db.ref(`messages/${currentServerId}/${currentChannelId}`);
      msgRef.on('value', snapshot => {
        const container = document.getElementById('messages-container');
        container.innerHTML = '';
        snapshot.forEach(child => {
          const msg = child.val();
          const div = document.createElement('div');
          div.className = 'message';
          
          let contentHtml = `<p>${msg.text || ''}</p>`;
          if (msg.image) contentHtml += `<img src="${msg.image}" class="message-img">`;
          if (msg.audio) contentHtml += `<audio controls src="${msg.audio}" style="margin-top:6px;"></audio>`;

          div.innerHTML = `
            <div class="avatar">${(msg.senderName || 'U')[0].toUpperCase()}</div>
            <div class="message-content">
              <h4>${msg.senderName || 'Anônimo'} <span>${new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></h4>
              ${contentHtml}
            </div>
          `;
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    function sendMessage(extraData = {}) {
      const input = document.getElementById('chat-message-input');
      const text = input.value.trim();
      if (!text && !extraData.image && !extraData.audio) return;

      db.ref(`messages/${currentServerId}/${currentChannelId}`).push({
        senderId: currentUser.uid,
        senderName: currentUser.username,
        text: text,
        timestamp: Date.now(),
        ...extraData
      });

      input.value = '';
    }

    // Fotos e Áudios
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        sendMessage({ image: evt.target.result });
      };
      reader.readAsDataURL(file);
    }

    async function toggleAudioRecord() {
      const micBtn = document.getElementById('mic-btn');
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/mp3' });
            const reader = new FileReader();
            reader.onload = e => sendMessage({ audio: e.target.result });
            reader.readAsDataURL(blob);
          };
          mediaRecorder.start();
          isRecording = true;
          micBtn.style.color = '#f23f43';
        } catch(err) {
          alert("Permissão do microfone é necessária!");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.style.color = '#b5bac1';
      }
    }

    // Amigos e Navegação
    function openDirectMessages() {
      currentServerId = null;
      document.getElementById('sidebar-header-title').innerText = "Mensagens Diretas";
      document.getElementById('main-chat-area').style.display = 'none';
      document.getElementById('search-servers-view').style.display = 'none';
      document.getElementById('friends-view').style.display = 'block';
      loadFriends();
    }

    function addFriendPrompt() {
      const email = prompt("Digite o e-mail do seu amigo para adicionar:");
      if (!email) return;
      db.ref('users').orderByChild('email').equalTo(email).once('value', snapshot => {
        if (snapshot.exists()) {
          const friendId = Object.keys(snapshot.val())[0];
          db.ref(`friends/${currentUser.uid}/${friendId}`).set(true);
          alert("Amigo adicionado!");
          loadFriends();
        } else {
          alert("Usuário não encontrado!");
        }
      });
    }

    function loadFriends() {
      db.ref(`friends/${currentUser.uid}`).on('value', snapshot => {
        const list = document.getElementById('friends-list');
        list.innerHTML = '';
        if (!snapshot.exists()) {
          list.innerHTML = '<p style="color:#949ba4;">Você ainda não possui amigos adicionados.</p>';
          return;
        }
        snapshot.forEach(child => {
          db.ref(`users/${child.key}`).once('value', uSnap => {
            const friend = uSnap.val();
            if(!friend) return;
            const div = document.createElement('div');
            div.className = 'server-card';
            div.innerHTML = `
              <div style="display:flex; align-items:center; gap:12px;">
                <div class="avatar">${(friend.username||'U')[0].toUpperCase()}</div>
                <div><strong>${friend.username}</strong><br><small style="color:#949ba4">${friend.email}</small></div>
              </div>
            `;
            list.appendChild(div);
          });
        });
      });
    }

    function openSearchServers() {
      document.getElementById('main-chat-area').style.display = 'none';
      document.getElementById('friends-view').style.display = 'none';
      document.getElementById('search-servers-view').style.display = 'block';
      
      db.ref('servers').once('value', snapshot => {
        const list = document.getElementById('public-servers-list');
        list.innerHTML = '';
        snapshot.forEach(child => {
          const s = child.val();
          const div = document.createElement('div');
          div.className = 'server-card';
          div.innerHTML = `
            <div><strong>${s.name}</strong></div>
            <button class="btn-auth" style="width:auto; padding:6px 16px;" onclick="joinServer('${child.key}')">Entrar</button>
          `;
          list.appendChild(div);
        });
      });
    }

    function joinServer(serverId) {
      db.ref(`servers/${serverId}/members/${currentUser.uid}`).set(true).then(() => {
        alert("Você entrou no servidor!");
        loadServers();
      });
    }
  </script>
</body>
</html>
