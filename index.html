<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soares App</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
    height:100vh;
}

button{
    border:0;
    cursor:pointer;
}

/* TELA DE AUTENTICAÇÃO (LOGIN/CADASTRO) */
#authScreen {
    position: fixed;
    inset: 0;
    background: #111827;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.auth-box {
    background: #20232a;
    padding: 30px;
    border-radius: 12px;
    width: 90%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.auth-box h2 {
    margin-top: 0;
    color: #5865f2;
}

.auth-box input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    background: #111318;
    border: 1px solid #333;
    outline: 0;
    border-radius: 7px;
    color: white;
}

.auth-box button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 7px;
    background: #5865f2;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.auth-toggle {
    margin-top: 15px;
    font-size: 13px;
    color: #949ba4;
    cursor: pointer;
}

.auth-toggle span {
    color: #5865f2;
    text-decoration: underline;
}

.app{
    display:flex;
    height:100vh;
}

/* SERVIDORES */
.servers{
    width:65px;
    background:#111318;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px;
    gap:10px;
}

.server{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#292c33;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.server.main{
    background:#5865f2;
    font-weight:bold;
}

.server.add{
    color:#23a559;
    font-size:27px;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background:#20232a;
    display:flex;
    flex-direction:column;
}

.header{
    padding:18px;
    font-size:20px;
    font-weight:bold;
    border-bottom:1px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logout-btn {
    background: transparent;
    color: #f23f43;
    font-size: 12px;
}

.search{
    margin:10px;
    padding:11px;
    background:#111318;
    border:0;
    outline:0;
    border-radius:7px;
    color:white;
    width:calc(100% - 20px);
}

.section{
    color:#949ba4;
    font-size:11px;
    font-weight:bold;
    padding:15px 12px 7px;
}

.item{
    margin:2px 8px;
    padding:10px;
    border-radius:6px;
    cursor:pointer;
    color:#b5bac1;
}

.item:hover{
    background:#353941;
    color:white;
}

/* CHAT */
.chat{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chat-header{
    height:60px;
    padding:0 20px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #333;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

.avatar{
    width:40px;
    height:40px;
    min-width:40px;
    border-radius:50%;
    background:#5865f2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.message-text{
    margin-top:4px;
    color:#dbdee1;
    word-break:break-word;
}

.message-time{
    color:#777;
    font-size:11px;
    margin-left:5px;
}

.input-area{
    display:flex;
    padding:12px;
    gap:8px;
}

.input-area input{
    flex:1;
    background:#383a40;
    color:white;
    border:0;
    outline:0;
    border-radius:8px;
    padding:14px;
}

.send{
    width:50px;
    border-radius:8px;
    background:#5865f2;
    color:white;
    font-size:20px;
}

/* MOBILE */
@media(max-width:700px){
    .servers{ width:55px; }
    .server{ width:40px; height:40px; }
    .sidebar{ width:210px; }
}

@media(max-width:500px){
    .servers{ display:none; }
    .sidebar{ width:100%; }
    .chat{ display:none; }
    .sidebar.mobile-hidden{ display:none; }
    .chat.mobile-show{ display:flex; width:100%; }
    .back{ display:block !important; }
}

.back{
    display:none;
    background:none;
    color:white;
    font-size:20px;
}

</style>
</head>

<body>

<!-- TELA DE LOGIN / CADASTRO -->
<div id="authScreen">
    <div class="auth-box">
        <h2 id="authTitle">Soares App</h2>
        
        <input type="text" id="authNome" placeholder="Seu Nome / Apelido">
        <input type="email" id="authEmail" placeholder="E-mail">
        <input type="password" id="authSenha" placeholder="Senha (mínimo 6 caracteres)">
        
        <button id="btnAuth" onclick="executarAuth()">Entrar</button>
        
        <div class="auth-toggle" onclick="alternarModoAuth()">
            <span id="authToggleText">Não tem conta? Cadastre-se</span>
        </div>
    </div>
</div>

<!-- APLICAÇÃO PRINCIPAL -->
<div class="app">

    <div class="servers">
        <div class="server main">S</div>
        <div class="server">👥</div>
        <div class="server">🎮</div>
        <div class="server">⚽</div>
        <div class="server add">+</div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="header">
            <span>Soares App</span>
            <button class="logout-btn" onclick="fazerLogout()">Sair</button>
        </div>

        <input class="search" id="pesquisa" placeholder="🔎 Procurar" oninput="pesquisar()">

        <div class="section">CANAL GERAL</div>
        <div id="listaCanais">
            <div class="item" onclick="abrirChat('Geral')">💬 Chat Geral</div>
        </div>
    </div>

    <div class="chat" id="chat">
        <div class="chat-header">
            <button class="back" onclick="voltar()">←</button>
            <span>💬</span>
            <strong id="chatNome">Chat Geral</strong>
        </div>

        <div class="messages" id="messages">
            <p style="color:#949ba4">Carregando mensagens...</p>
        </div>

        <div class="input-area">
            <input id="messageInput" placeholder="Digite uma mensagem..." onkeydown="tecla(event)">
            <button class="send" onclick="enviar()">➤</button>
        </div>
    </div>

</div>

<!-- FIREBASE SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    onAuthStateChanged, 
    updateProfile,
    signOut 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    query, 
    orderBy, 
    onSnapshot, 
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Sua configuração do Firebase obtida no console
  const firebaseConfig = {
    apiKey: "AIzaSyDEGZZtnPoZh68ouIV7N6joPZ1TjRkcw4Q",
    authDomain: "soares-app-61b17.firebaseapp.com",
    projectId: "soares-app-61b17",
    storageBucket: "soares-app-61b17.firebasestorage.app",
    messagingSenderId: "246291781042",
    appId: "1:246291781042:web:d88b50a9a790a8db2180ab",
    measurementId: "G-X5R46KHPH1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let usuarioAtual = null;
  let modoCadastro = false;
  let unsubscribeMensagens = null;

  // Monitora estado de autenticação
  onAuthStateChanged(auth, (user) => {
    if (user) {
      usuarioAtual = user;
      document.getElementById("authScreen").style.display = "none";
      carregarMensagens();
    } else {
      usuarioAtual = null;
      document.getElementById("authScreen").style.display = "flex";
      if(unsubscribeMensagens) unsubscribeMensagens();
    }
  });

  // Alterna entre tela de Login e Cadastro
  window.alternarModoAuth = function() {
    modoCadastro = !modoCadastro;
    const nomeInput = document.getElementById("authNome");
    const btn = document.getElementById("btnAuth");
    const toggle = document.getElementById("authToggleText");
    
    if(modoCadastro) {
      nomeInput.style.display = "block";
      btn.innerText = "Cadastrar";
      toggle.innerText = "Já tem conta? Faça login";
    } else {
      nomeInput.style.display = "none";
      btn.innerText = "Entrar";
      toggle.innerText = "Não tem conta? Cadastre-se";
    }
  };

  // Inicializa o campo de nome oculto por padrão (Modo Login)
  document.getElementById("authNome").style.display = "none";

  // Login / Cadastro
  window.executarAuth = async function() {
    const email = document.getElementById("authEmail").value.trim();
    const senha = document.getElementById("authSenha").value.trim();
    const nome = document.getElementById("authNome").value.trim();

    if(!email || !senha) {
      alert("Preencha e-mail e senha!");
      return;
    }

    try {
      if(modoCadastro) {
        if(!nome) {
          alert("Digite seu nome!");
          return;
        }
        const res = await createUserWithEmailAndPassword(auth, email, senha);
        await updateProfile(res.user, { displayName: nome });
      } else {
        await signInWithEmailAndPassword(auth, email, senha);
      }
    } catch(err) {
      alert("Erro na autenticação: " + err.message);
    }
  };

  window.fazerLogout = function() {
    signOut(auth);
  };

  // Enviar mensagem para o Firestore
  window.enviar = async function() {
    const input = document.getElementById("messageInput");
    const texto = input.value.trim();

    if(!texto || !usuarioAtual) return;

    try {
      await addDoc(collection(db, "mensagens"), {
        texto: texto,
        autor: usuarioAtual.displayName || usuarioAtual.email.split('@')[0],
        userId: usuarioAtual.uid,
        data: serverTimestamp()
      });
      input.value = "";
    } catch(err) {
      alert("Erro ao enviar mensagem: " + err.message);
    }
  };

  window.tecla = function(event) {
    if(event.key === "Enter") enviar();
  };

  // Escutar mensagens do Firestore em tempo real
  function carregarMensagens() {
    const q = query(collection(db, "mensagens"), orderBy("data", "asc"));

    unsubscribeMensagens = onSnapshot(q, (snapshot) => {
      const messagesContainer = document.getElementById("messages");
      messagesContainer.innerHTML = "";

      snapshot.forEach((doc) => {
        const msg = doc.data();
        const hora = msg.data ? new Date(msg.data.toDate()).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}) : "...";

        const div = document.createElement("div");
        div.className = "message";
        div.innerHTML = `
          <div class="avatar">${(msg.autor || "U")[0].toUpperCase()}</div>
          <div>
            <strong>${msg.autor || "Usuário"}</strong>
            <span class="message-time">${hora}</span>
            <div class="message-text">${msg.texto}</div>
          </div>
        `;
        messagesContainer.appendChild(div);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });
  }

  window.abrirChat = function(nome) {
    document.getElementById("chatNome").innerText = nome;
    document.getElementById("sidebar").classList.add("mobile-hidden");
    document.getElementById("chat").classList.add("mobile-show");
  };

  window.voltar = function() {
    document.getElementById("chat").classList.remove("mobile-show");
    document.getElementById("sidebar").classList.remove("mobile-hidden");
  };

  window.pesquisar = function() {
    const texto = document.getElementById("pesquisa").value.toLowerCase();
    document.querySelectorAll(".item").forEach(item => {
      item.style.display = item.innerText.toLowerCase().includes(texto) ? "block" : "none";
    });
  };
</script>

</body>
</html>
