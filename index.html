<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soares App - Chat em Tempo Real</title>

    <!-- Importação dos SDKs Compatíveis do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --msg-mine: #4f46e5;
            --msg-other: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Telas (Auth e Chat) */
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
        }

        .auth-screen {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .welcome-title {
            text-align: center;
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid transparent;
            background: var(--bg-input);
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 0.5rem;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .toggle-auth {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-sub);
            cursor: pointer;
        }

        .toggle-auth span {
            color: var(--accent);
            text-decoration: underline;
        }

        /* Interface do Chat */
        .chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            padding: 1rem;
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #374151;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-wrapper {
            position: relative;
            cursor: pointer;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .avatar-upload-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.2s;
            font-size: 0.7rem;
            color: white;
        }

        .avatar-wrapper:hover .avatar-upload-overlay {
            opacity: 1;
        }

        .header-title h3 {
            font-size: 1rem;
        }

        .header-title p {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-bubble {
            max-width: 75%;
            padding: 0.8rem;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
            display: flex;
            gap: 8px;
        }

        .message-bubble.mine {
            align-self: flex-end;
            background: var(--msg-mine);
            border-bottom-right-radius: 2px;
        }

        .message-bubble.other {
            align-self: flex-start;
            background: var(--msg-other);
            border-bottom-left-radius: 2px;
        }

        .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .msg-content {
            display: flex;
            flex-direction: column;
        }

        .msg-sender {
            font-size: 0.7rem;
            color: #cbd5e1;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .chat-input-area {
            padding: 1rem;
            background: #111827;
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 0.8rem;
            border-radius: 8px;
            border: none;
            background: var(--bg-input);
            color: var(--text-main);
            outline: none;
        }

        .chat-input-area button {
            padding: 0.8rem 1.2rem;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* Ocultar input de arquivo */
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tela de Autenticação -->
        <div id="auth-screen" class="auth-screen">
            <h2 class="welcome-title">Bem-vindo ao aplicativo teste do Soares!</h2>
            <p class="subtitle" id="auth-subtitle">Crie sua conta para começar a conversar</p>

            <form id="auth-form">
                <div class="form-group" id="group-name">
                    <label>Seu Nome</label>
                    <input type="text" id="input-name" placeholder="Ex: Gabriel Soares">
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="input-email" required placeholder="seuemail@exemplo.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="input-password" required placeholder="******">
                </div>
                <button type="submit" class="btn" id="btn-submit">Cadastrar</button>
            </form>

            <div class="toggle-auth" id="toggle-auth">
                Já tem conta? <span id="toggle-text">Faça login</span>
            </div>
        </div>

        <!-- Tela do Chat -->
        <div id="chat-screen" class="chat-screen">
            <div class="chat-header">
                <div class="user-info">
                    <div class="avatar-wrapper" onclick="triggerFileInput()" title="Clique para mudar a foto">
                        <img id="user-avatar" class="avatar" src="https://via.placeholder.com/150" alt="Avatar">
                        <div class="avatar-upload-overlay">Mudar</div>
                    </div>
                    <div class="header-title">
                        <h3 id="user-display-name">Carregando...</h3>
                        <p>Bem-vindo ao aplicativo teste do Soares!</p>
                    </div>
                </div>
                <button class="btn-logout" onclick="logout()">Sair</button>
            </div>

            <input type="file" id="file-input" accept="image/*" onchange="uploadAvatar(event)">

            <div class="chat-messages" id="chat-messages">
                <!-- As mensagens aparecerão aqui em tempo real -->
            </div>

            <form class="chat-input-area" id="chat-form">
                <input type="text" id="message-input" placeholder="Digite sua mensagem..." required autocomplete="off">
                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCcWt4GJQ81K6Hy707iDnnF9MOquIC5ves",
            authDomain: "soares-app-61b17.firebaseapp.com",
            projectId: "soares-app-61b17",
            storageBucket: "soares-app-61b17.firebasestorage.app",
            messagingSenderId: "246291781042",
            appId: "1:246291781042:web:d06b58a9a798a8db2188ab"
        };

        // Inicializando Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Elementos da DOM
        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const authForm = document.getElementById('auth-form');
        const groupName = document.getElementById('group-name');
        const inputName = document.getElementById('input-name');
        const inputEmail = document.getElementById('input-email');
        const inputPassword = document.getElementById('input-password');
        const btnSubmit = document.getElementById('btn-submit');
        const toggleAuth = document.getElementById('toggle-auth');
        const toggleText = document.getElementById('toggle-text');
        const authSubtitle = document.getElementById('auth-subtitle');
        
        const userAvatar = document.getElementById('user-avatar');
        const userDisplayName = document.getElementById('user-display-name');
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');

        let isLoginState = false;
        let currentUser = null;

        // Alternar entre Cadastro e Login
        toggleAuth.addEventListener('click', () => {
            isLoginState = !isLoginState;
            if (isLoginState) {
                groupName.style.display = 'none';
                btnSubmit.textContent = 'Entrar';
                toggleText.textContent = 'Cadastre-se';
                authSubtitle.textContent = 'Entre com suas credenciais para acessar';
            } else {
                groupName.style.display = 'block';
                btnSubmit.textContent = 'Cadastrar';
                toggleText.textContent = 'Faça login';
                authSubtitle.textContent = 'Crie sua conta para começar a conversar';
            }
        });

        // Cadastro / Login Evento
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = inputEmail.value;
            const password = inputPassword.value;

            try {
                if (isLoginState) {
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    const name = inputName.value || "Usuário Soares";
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=4f46e5&color=fff`;

                    await userCredential.user.updateProfile({
                        displayName: name,
                        photoURL: defaultAvatar
                    });

                    // Salvar perfil no Firestore
                    await db.collection('users').doc(userCredential.user.uid).set({
                        uid: userCredential.user.uid,
                        name: name,
                        email: email,
                        photoURL: defaultAvatar
                    });
                }
            } catch (error) {
                alert("Erro na autenticação: " + error.message);
            }
        });

        // Monitorar Estado do Usuário
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                authScreen.style.display = 'none';
                chatScreen.style.display = 'flex';

                // Carregar dados atualizados do usuário
                userDisplayName.textContent = user.displayName || "Usuário Soares";
                userAvatar.src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.email)}&background=4f46e5&color=fff`;

                loadMessages();
            } else {
                currentUser = null;
                authScreen.style.display = 'flex';
                chatScreen.style.display = 'none';
            }
        });

        // Sair da Conta
        function logout() {
            auth.signOut();
        }

        // Mudar Foto de Perfil (Converte para Base64 para praticidade no teste)
        function triggerFileInput() {
            document.getElementById('file-input').click();
        }

        function uploadAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Image = e.target.result;

                try {
                    await currentUser.updateProfile({ photoURL: base64Image });
                    userAvatar.src = base64Image;

                    await db.collection('users').doc(currentUser.uid).update({
                        photoURL: base64Image
                    });

                    alert("Foto de perfil atualizada com sucesso!");
                } catch (err) {
                    alert("Erro ao atualizar foto: " + err.message);
                }
            };
            reader.readAsDataURL(file);
        }

        // Enviar Mensagem
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            messageInput.value = '';

            try {
                await db.collection('messages').add({
                    text: text,
                    uid: currentUser.uid,
                    senderName: currentUser.displayName || "Usuário",
                    photoURL: currentUser.photoURL || "https://via.placeholder.com/150",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (err) {
                alert("Erro ao enviar mensagem: " + err.message);
            }
        });

        // Carregar Mensagens do Chat em Tempo Real
        function loadMessages() {
            db.collection('messages')
                .orderBy('createdAt', 'asc')
                .onSnapshot(snapshot => {
                    chatMessages.innerHTML = '';
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const isMine = data.uid === currentUser.uid;

                        const bubble = document.createElement('div');
                        bubble.className = `message-bubble ${isMine ? 'mine' : 'other'}`;

                        const avatarImg = `<img class="msg-avatar" src="${data.photoURL || 'https://via.placeholder.com/150'}" alt="Foto">`;
                        
                        bubble.innerHTML = `
                            ${!isMine ? avatarImg : ''}
                            <div class="msg-content">
                                ${!isMine ? `<div class="msg-sender">${data.senderName}</div>` : ''}
                                <div>${escapeHtml(data.text)}</div>
                            </div>
                            ${isMine ? avatarImg : ''}
                        `;

                        chatMessages.appendChild(bubble);
                    });
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                });
        }

        // Função de segurança para escapar caracteres HTML
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
